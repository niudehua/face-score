name: 清理过期记录与图片
on:
  schedule:
    # UTC 10:00 = Asia/Shanghai 18:00
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: face-score-maintenance
  cancel-in-progress: false
jobs:
  run-scheduled-tasks:
    name: 验证维护权限、清理并复核
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 执行清理及前后检查
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: bash scripts/run-maintenance.sh
