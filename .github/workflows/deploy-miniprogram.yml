name: 上传小程序开发版（微信）

on:
  push:
    branches:
      - main
    paths:
      - "face-score-miniprogram/**" # 只有修改小程序目录才触发
  workflow_dispatch: # 允许手动触发

jobs:
  deploy:
    name: 上传开发版（不审核、不发布）
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置Node.js环境
      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. 安装miniprogram-ci
      - name: 安装微信小程序CI工具
        run: npm install -g miniprogram-ci

      # 4. 进入小程序目录
      - name: 进入小程序目录
        working-directory: ./face-score-miniprogram
        run: pwd

      # 5. 配置私钥
      - name: 配置私钥
        env:
          WECHAT_UPLOAD_KEY: ${{ secrets.WECHAT_UPLOAD_KEY }}
        working-directory: ./face-score-miniprogram
        run: |
          umask 077
          printf '%s' "$WECHAT_UPLOAD_KEY" > private.key

      # 6. Generate public runtime configuration without shell interpolation.
      - name: 配置环境变量
        working-directory: ./face-score-miniprogram
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const { API_BASE_URL, WECHAT_APPID } = process.env;
          if (!API_BASE_URL || !WECHAT_APPID) throw new Error('Missing API_BASE_URL or WECHAT_APPID');
          fs.writeFileSync('config/config.local.js', 'module.exports = ' + JSON.stringify({ apiUrl: API_BASE_URL, appid: WECHAT_APPID, debug: false }) + ';\n');
          const project = JSON.parse(fs.readFileSync('project.config.json', 'utf8'));
          project.appid = WECHAT_APPID;
          fs.writeFileSync('project.config.json', JSON.stringify(project, null, 2));
          JS

      # 7. 上传小程序代码
      - name: 上传小程序代码
        working-directory: ./face-score-miniprogram
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
        run: |
          # 使用GitHub Actions运行次数作为版本号，格式：1.0.${run_number}
          VERSION="1.0.${{ github.run_number }}"
          echo "使用版本号: $VERSION"

          # 按照官方文档使用正确的命令行参数
          miniprogram-ci upload \
            --appid "$WECHAT_APPID" \
            --pkp ./private.key \
            --pp . \
            --uv "$VERSION" \
            --ud "自动部署 $VERSION" \
            --robot 1 \
            --enable-es6 true \
            --enable-minify true

      # 8. 清理临时文件
      - name: 清理私钥
        if: always()
        working-directory: ./face-score-miniprogram
        run: rm -f private.key

      # 9. 输出部署结果
      - name: 开发版上传完成
        run: echo "小程序开发版上传成功，审核与正式发布需在微信后台操作。"
